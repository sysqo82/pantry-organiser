# Project-wide Gradle settings.

# AndroidX is the successor to the Android Support Library.
# It provides backward compatibility and modern features.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX.
android.enableJetifier=true

# Kotlin code style for the project.
kotlin.code.style=official

# Enable parallel execution of Gradle tasks.
org.gradle.parallel=true

# Increase heap size for Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
